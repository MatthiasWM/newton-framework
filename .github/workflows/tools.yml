# newtc and newtdump for macOS, Windows and Linux, on Intel and ARM: built
# as release binaries (with FLTK, without sanitizers), tried, and packed as
# one archive per system, named as Node names them (process.platform-
# process.arch: darwin-arm64, linux-x64, win32-arm64, ...), so VSNewt can
# take the one it runs on.
#
# Every run keeps the archives as the run's artifacts. A tag "tools-v<version>"
# (e.g. tools-v0.1) also makes a GitHub release with them.
#
# Linux: built on Ubuntu 22.04 (an older glibc, so the binaries run on more
# systems). newtc needs X11's libraries (libX11, libXft, fontconfig, ...),
# as any desktop has them. macOS: 13 (Ventura) and later; the Intel build is
# made on Apple silicon and tried under Rosetta. Not signed (ad hoc only).
name: tools

on:
  push:
    branches: [dap_to_toolbox, 'tools-*']
    tags: ['tools-v*']
  workflow_dispatch:

permissions:
  contents: write   # the release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: darwin-arm64, os: macos-15,         cmake_args: "-G Ninja -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0" }
          - { name: darwin-x64,   os: macos-15,         cmake_args: "-G Ninja -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0", run: "arch -x86_64" }
          - { name: linux-x64,    os: ubuntu-22.04,     cmake_args: "-G Ninja -DFLTK_BACKEND_WAYLAND=OFF" }
          - { name: linux-arm64,  os: ubuntu-22.04-arm, cmake_args: "-G Ninja -DFLTK_BACKEND_WAYLAND=OFF" }
          - { name: win32-x64,    os: windows-2022,     cmake_args: "-A x64",   exe: ".exe" }
          - { name: win32-arm64,  os: windows-11-arm,   cmake_args: "-A ARM64", exe: ".exe" }
    steps:
      - uses: actions/checkout@v5

      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Ninja and X11 for FLTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libx11-dev libxext-dev libxft-dev \
            libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libxi-dev libfontconfig1-dev

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEWTC_UBSAN=OFF -DNEWTC_USES_FLTK=ON -DNEWTON_BUILD_TESTS=OFF ${{ matrix.cmake_args }}

      # 4 jobs: --parallel alone is an unlimited make -j (see newton_ncx.yml)
      - name: Build
        shell: bash
        run: cmake --build build --config Release --target newtc newtdump newtdump-test-newton --parallel 4

      - name: Collect
        shell: bash
        run: |
          # multi-config generators (Visual Studio) put them in build/Release
          bin=build; [ -d build/Release ] && bin=build/Release
          mkdir -p dist/newtc-${{ matrix.name }}
          for p in newtc newtdump; do cp "$bin/$p${{ matrix.exe }}" dist/newtc-${{ matrix.name }}/; done
          cp "$bin/newtdump-test-newton${{ matrix.exe }}" dist/
          cp ReadMe.md dist/newtc-${{ matrix.name }}/
          if [ "${{ runner.os }}" != "Windows" ]; then strip dist/newtc-${{ matrix.name }}/newtc dist/newtc-${{ matrix.name }}/newtdump; fi
          if [ "${{ runner.os }}" == "macOS" ]; then
            for p in newtc newtdump; do codesign --force --sign - dist/newtc-${{ matrix.name }}/$p; done
          fi

      - name: Try them
        shell: bash
        run: |
          d=dist/newtc-${{ matrix.name }}
          cd "$RUNNER_TEMP"
          printf 'x := {a: 6};\nPrint(x.a * 7);\n' > try.ns
          out=$(${{ matrix.run }} "$GITHUB_WORKSPACE/$d/newtc${{ matrix.exe }}" -script try.ns < /dev/null)
          echo "$out"
          [ "$(echo "$out" | tr -d '\r')" = "42" ]
          ${{ matrix.run }} "$GITHUB_WORKSPACE/$d/newtc${{ matrix.exe }}" -s 'Print("hello");' < /dev/null
          ${{ matrix.run }} "$GITHUB_WORKSPACE/$d/newtdump${{ matrix.exe }}" --help > /dev/null

      - name: newtdump's test (macOS, Linux)
        if: runner.os != 'Windows' && matrix.name != 'darwin-x64'
        run: |
          mkdir -p dist/test && cp dist/newtc-${{ matrix.name }}/newtdump dist/newtdump-test-newton dist/test/
          python3 Test/newtdump/test_newtdump.py --build dist/test

      - name: Pack
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" == "Windows" ]; then
            7z a -tzip newtc-${{ matrix.name }}.zip newtc-${{ matrix.name }}
          else
            tar czf newtc-${{ matrix.name }}.tar.gz newtc-${{ matrix.name }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: newtc-${{ matrix.name }}
          path: dist/newtc-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/tools-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" \
            --title "newtc and newtdump ${GITHUB_REF_NAME#tools-v}" \
            --notes "newtc (NewtonScript compiler, interpreter, debugger) and newtdump (reads a Newton's ROM and PCMCIA cards) for macOS, Windows and Linux. Built from ${{ github.sha }}."
